# ~/.config/hypr/hyprpaper.conf
# Formato do hyprpaper 0.8+ (bloco wallpaper { }).
# Para trocar o papel de parede: mude o "path" e rode
#   systemctl --user restart hyprpaper
# Ou, sem editar nada, na hora:
#   hyprctl hyprpaper wallpaper ",/caminho/da/imagem.jpg"

wallpaper {
    monitor  =                                            # vazio = todos os monitores
    path     = /home/erick/Imagens/wallpapers/synthwave.jpg
    fit_mode = cover                                      # cover | contain | tile
}

# Exemplo: uma imagem diferente por monitor (comente o bloco acima e use estes)

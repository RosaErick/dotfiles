<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Ordem das fontes monoespacadas, incluindo o fallback automatico do Kitty. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>PlemolJP Console NF</family>
      <family>BlexMono Nerd Font</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>PlemolJP Console NF</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>BlexMono Nerd Font</string>
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>

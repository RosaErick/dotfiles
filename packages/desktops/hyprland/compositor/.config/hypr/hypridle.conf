# ~/.config/hypr/hypridle.conf  -- aplicar: systemctl --user restart hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock       # evita hyprlock duplicado
    before_sleep_cmd = loginctl lock-session    # bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # acorda as telas
}

# ponytail: sem listener de "escurecer a tela" - esta maquina nao tem backlight
# (/sys/class/backlight vazio), entao nao ha o que escurecer.

listener {                       # 1 h: desliga os monitores
    timeout = 3600
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {                       # 3 h: bloqueia
    timeout = 10800
    on-timeout = loginctl lock-session
}

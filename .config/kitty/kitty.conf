# ~/.config/kitty/kitty.conf
# Espelha as escolhas do ghostty para os dois terminais serem intercambiaveis.
# As cores vivem em theme.conf, gerado por `theme` a partir da paleta.

include theme.conf

# ── Fonte ─────────────────────────────────────────────────────────
# Fallbacks BlexMono Nerd Font e JetBrainsMono Nerd Font, nessa ordem,
# definidos em ~/.config/fontconfig/conf.d/50-terminal-fonts.conf.
font_family      PlemolJP Console NF
font_size        12.0
modify_font      cell_height 112%

# ── Shell ─────────────────────────────────────────────────────────
# Abre direto numa sessao tmux, reaproveitando a existente (-A anexa se ja
# houver, cria se nao). O guard com `command -v` faz o terminal cair no zsh
# se o tmux sumir, em vez de simplesmente nao abrir.
shell /bin/sh -c 'command -v tmux >/dev/null && exec tmux new-session -A -s main || exec zsh -l'
shell_integration enabled

# ── Transparencia e blur ──────────────────────────────────────────
# O blur e do compositor (Hyprland desfoca o que esta atras de qualquer
# superficie translucida). Aqui basta a opacidade.
background_opacity 0.9
dynamic_background_opacity yes

# ── Janela ────────────────────────────────────────────────────────
window_padding_width 8 4
confirm_os_window_close 0
hide_window_decorations no
remember_window_size  no
initial_window_width  110c
initial_window_height 30c

# ── Cursor ────────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0
mouse_hide_wait 2.0

# ── Abas ──────────────────────────────────────────────────────────
tab_bar_edge   top
tab_bar_style  powerline
tab_powerline_style slanted

# ── Diversos ──────────────────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no
copy_on_select    no

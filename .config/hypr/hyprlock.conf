# ~/.config/hypr/hyprlock.conf  -- testar: hyprlock --immediate (Esc/senha pra sair)

general {
    hide_cursor = true
}

background {
    monitor =
    # $HOME em vez de caminho absoluto: nao vaza o usuario no repo publico.
    # Se a imagem nao existir (outra maquina, outro wallpaper), cai na cor
    # abaixo em vez de tela preta.
    path = $HOME/Imagens/wallpapers/synthwave.jpg
    color = rgb(16, 16, 16)
    blur_passes = 3
    brightness = 0.4
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(c4a7e7)
    inner_color = rgb(14141c)
    font_color = rgb(e0def4)
    fail_color = rgb(eb6f92)
    placeholder_text = <span foreground="##908caa">senha</span>
    fail_text = <span foreground="##eb6f92">errou ($ATTEMPTS)</span>
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(e0def4)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

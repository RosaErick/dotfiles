# Carbonfox — paleta IBM Carbon (EdenEast/nightfox.nvim)
name = "carbonfox"

[colors]
bg        = "#161616"   # fundo principal
bg_alt    = "#1c1c1c"   # fundo de painel / elemento
bg_high   = "#282828"   # destaque, hover
sel       = "#2a2a2a"   # seleção
line      = "#484848"   # bordas, separadores

fg        = "#f2f4f8"   # texto principal
fg_dim    = "#b6b8bb"   # texto secundário
fg_mute   = "#6f6f6f"   # texto apagado

red       = "#ee5396"
green     = "#25be6a"
yellow    = "#08bdba"
blue      = "#78a9ff"
magenta   = "#be95ff"
cyan      = "#33b1ff"

accent    = "#fa4d56"   # cor de destaque da UI
                        # Carbon red-50 — mesma familia do resto da paleta,
                        # entao combina por construcao e nao por acaso.
urgent    = "#ee5396"   # crítico / erro

[opts]
# GTK CSS nao aceita #RRGGBBAA -> use rgba({{bg_raw}}, {{alpha}})
# mako aceita hex com alpha -> use {{bg}}{{alpha_hex}}
alpha     = "0.90"
alpha_hex = "e6"
# overlays grandes (grade de apps) pedem mais opacidade pra ler bem
alpha_solid = "0.97"
# rofi: mais transparente porque o Hyprland desfoca atras dele
# (layer_rule "blur-rofi" no hyprland.lua). Sem o blur, baixar isto
# deixa o texto ilegivel sobre o fundo nitido.
alpha_rofi  = "0.82"
radius    = "8px"
# BlexMono e a propria IBM Plex Mono com os glifos Nerd Font embutidos:
# uma familia so cobre texto e icones. O font_alt fica como rede se o
# pacote ttf-ibmplex-mono-nerd sumir.
font      = "BlexMono Nerd Font"
font_alt  = "JetBrainsMono Nerd Font"
font_size = "13px"
